<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaysetta VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121216;
            --card-bg: #1c1c24;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text: #ffffff;
            --text-secondary: #9ca3af;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 22px;
            margin: 0 0 8px;
            color: var(--accent);
        }
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }
        .tariffs-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .tariff-card {
            background: var(--card-bg);
            border: 1px solid #2d2d3d;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tariff-card:active {
            transform: scale(0.98);
            border-color: var(--accent);
        }
        .tariff-card.special {
            border-color: var(--accent);
            background: linear-gradient(135deg, #1c1c24 0%, #2a1b4e 100%);
        }
        .tariff-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 4px;
        }
        .tariff-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }
        .tariff-price {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
        }
        .btn-main {
            width: 100%;
            max-width: 400px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SPAYSETTA VPN</h1>
        <p>Выбери подписку для быстрого интернета</p>
    </div>

    <div class="tariffs-container">
        <div class="tariff-card" onclick="selectTariff('week', 80, '1 неделя')">
            <div>
                <p class="tariff-title">⏳ 1 неделя</p>
                <p class="tariff-desc">Идеально для теста</p>
            </div>
            <div class="tariff-price">80 ₽</div>
        </div>

        <div class="tariff-card" onclick="selectTariff('month', 120, '1 месяц')">
            <div>
                <p class="tariff-title">⚡️ 1 месяц</p>
                <p class="tariff-desc">Самый популярный</p>
            </div>
            <div class="tariff-price">120 ₽</div>
        </div>

        <div class="tariff-card" onclick="selectTariff('2months', 200, '2 месяца')">
            <div>
                <p class="tariff-title">💎 2 месяца</p>
                <p class="tariff-desc">Выгодный выбор</p>
            </div>
            <div class="tariff-price">200 ₽</div>
        </div>

        <div class="tariff-card" onclick="selectTariff('3months', 400, '3 месяца')">
            <div>
                <p class="tariff-title">🔥 3 месяца</p>
                <p class="tariff-desc">Максимальная экономия</p>
            </div>
            <div class="tariff-price">400 ₽</div>
        </div>

        <div class="tariff-card special" onclick="selectTariff('lifetime', 2500, 'Навсегда (Lifetime)')">
            <div>
                <p class="tariff-title">♾️ Навсегда</p>
                <p class="tariff-desc">Безлимит навсегда</p>
            </div>
            <div class="tariff-price">2500 ₽</div>
        </div>
    </div>

    <button class="btn-main" onclick="openProfile()">👤 Мой профиль</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function selectTariff(id, price, name) {
            tg.sendData(JSON.stringify({action: "buy", tariff: id, price: price, title: name}));
        }

        function openProfile() {
            tg.sendData(JSON.stringify({action: "profile"}));
        }
    </script>
</body>
</html>
